<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बिहारी नितेश 414 - Official Website</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; line-height: 1.6; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 40px 20px; text-align: center; border-bottom: 2px solid #3b82f6; }
        header h1 { font-size: 2.5rem; color: #38bdf8; margin-bottom: 10px; }
        header p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 20px; }
        .insta-btn { display: inline-block; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; padding: 12px 25px; font-size: 1rem; font-weight: bold; text-decoration: none; border-radius: 30px; transition: 0.3s; }
        .insta-btn:hover { opacity: 0.9; transform: scale(1.05); }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 30px; color: #38bdf8; font-size: 2rem; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-top: 4px solid #3b82f6; }
        .card h3 { margin-bottom: 15px; color: #f8fafc; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #475569; background: #0f172a; color: white; border-radius: 6px; font-size: 0.95rem; }
        .submit-btn { background: #2563eb; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #1d4ed8; }
        footer { text-align: center; padding: 20px; background: #0f172a; color: #64748b; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>
    <header>
        <h1>बिहारी नितेश 414</h1>
        <p>स्वागत है आपका मेरी ऑफिशियल वेबसाइट पर! यहीं से वीडियो एडिटर, फोटोग्राफी और डेकोरेशन के लिए अप्लाई करें।</p>
        <a href="https://www.instagram.com/biharinitesh414?exln=MW9nanM1bWRueW1heA==" target="_blank" class="insta-btn">Instagram पर फॉलो करें</a>
    </header>

    <div class="container">
        <h2 class="section-title">सर्विस बुकिंग और एप्लीकेशन फॉर्म</h2>
        <div class="card-grid">
            <div class="card">
                <h3>🎬 वीडियो एडिटर (रखें/बनें)</h3>
                <form onsubmit="handleSubmit(event, 'Video Editor')">
                    <div class="form-group"><label>आपका नाम</label><input type="text" required placeholder="पूरा नाम लिखें"></div>
                    <div class="form-group"><label>मोबाइल नंबर / WhatsApp</label><input type="tel" required placeholder="नंबर दर्ज करें"></div>
                    <div class="form-group"><label>आप क्या करना चाहते हैं?</label>
                        <select><option>एडिटर के रूप में काम करना है</option><option>अपने वीडियो के लिए एडिटर चाहिए</option></select>
                    </div>
                    <button type="submit" class="submit-btn">आवेदन भेजें</button>
                </form>
            </div>

            <div class="card">
                <h3>📸 कैमरामैन / फोटोग्राफी</h3>
                <form onsubmit="handleSubmit(event, 'Photographer')">
                    <div class="form-group"><label>आपका नाम</label><input type="text" required placeholder="पूरा नाम लिखें"></div>
                    <div class="form-group"><label>मोबाइल नंबर / WhatsApp</label><input type="tel" required placeholder="नंबर दर्ज करें"></div>
                    <div class="form-group"><label>सर्विस का प्रकार</label>
                        <select><option>शूटिंग/फोटोग्राफी के लिए बुक करना है</option><option>कैमरामैन के तौर पर काम करना है</option></select>
                    </div>
                    <button type="submit" class="submit-btn">बुकिंग भेजें</button>
                </form>
            </div>

            <div class="card">
                <h3>✨ डेकोरेशन बुकिंग</h3>
                <form onsubmit="handleSubmit(event, 'Decoration')">
                    <div class="form-group"><label>आपका नाम</label><input type="text" required placeholder="पूरा नाम लिखें"></div>
                    <div class="form-group"><label>मोबाइल नंबर / WhatsApp</label><input type="tel" required placeholder="नंबर दर्ज करें"></div>
                    <div class="form-group"><label>कार्यक्रम की तारीख और विवरण</label><textarea rows="2" required placeholder="फंक्शन की डिटेल दें"></textarea></div>
                    <button type="submit" class="submit-btn">डेकोरेशन बुक करें</button>
                </form>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 बिहारी नितेश 414. All Rights Reserved.</p></footer>
    <script>
        function handleSubmit(event, serviceName) {
            event.preventDefault();
            alert('धन्यवाद! आपका ' + serviceName + ' का अनुरोध बिहारी नितेश तक पहुँच गया है। जल्द ही आपको संपर्क किया जाएगा।');
            event.target.reset();
        }
    </script>
</body>
</html>
