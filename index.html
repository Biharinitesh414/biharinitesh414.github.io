<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>बिहारी नितेश - पोर्टफोलियो</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- हेडर और प्रोफाइल सेक्शन -->
    <header>
        <img src="dp.jpg" alt="बिहारी नितेश" class="profile-img">
        <h1>बिहारी नितेश</h1>
        <p>डिजिटल क्रिएटर और वीडियो एडिटर</p>
    </header>

    <main>
        <!-- अबाउट सेक्शन -->
        <section class="about">
            <h2>मेरे बारे में</h2>
            <p>स्वागत है मेरी वेबसाइट पर! मैं डिजिटल कंटेंट निर्माण और वीडियो एडिटिंग में रुचि रखता हूँ।</p>
        </section>

        <!-- डायरेक्ट ईमेल फॉर्म सेक्शन -->
        <section class="contact-section">
            <h2>मुझसे संपर्क करें</h2>
            <form action="https://formspree.io/f/xqppgnvw" method="POST">
                <div class="form-group">
                    <label for="email">आपका ईमेल:</label><br>
                    <input type="email" id="email" name="email" required placeholder="अपना ईमेल दर्ज करें">
                </div>
                
                <br>

                <div class="form-group">
                    <label for="message">आपका संदेश:</label><br>
                    <textarea id="message" name="message" rows="5" required placeholder="अपना मैसेज यहाँ लिखें..."></textarea>
                </div>
                
                <br>

                <button type="submit">संदेश भेजें</button>
            </form>
        </section>
    </main>

    <!-- फुटर -->
    <footer>
        <p>&copy; 2026 बिहारी नितेश. सर्वाधिकार सुरक्षित.</p>
    </footer>

</body>
</html>
